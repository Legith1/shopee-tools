<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopee 多站点活动日历</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#172033;--muted:#728096;--line:#e6ebf2;--orange:#ee4d2d;--orange-weak:#fff1ed;--blue:#2563eb;--blue-weak:#eff6ff;--green:#168568;--green-weak:#eaf8f2;--red:#d33b57;--purple:#7357c7;--purple-weak:#f2efff;--shadow:0 6px 24px rgba(25,42,70,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{max-width:1480px;margin:auto;padding:26px 30px 46px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;margin-bottom:20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--orange)}h1{font-size:29px;letter-spacing:-.04em;margin:8px 0 5px}.sub{font-size:13px;color:var(--muted);line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;color:var(--ink);font-size:13px;cursor:pointer}.btn:hover{border-color:#c9d3e1;box-shadow:0 3px 10px rgba(25,42,70,.08)}.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.side{align-self:start;position:sticky;top:18px;padding:16px}.section-title{font-size:13px;font-weight:800;margin-bottom:10px}.site-list{display:grid;gap:3px}.site-btn{width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;border:0;border-radius:8px;padding:10px 9px;color:var(--muted);cursor:pointer;text-align:left}.site-btn:hover{background:#f8fafc;color:var(--ink)}.site-btn.active{background:var(--orange-weak);color:var(--orange);font-weight:750}.site-left{display:flex;align-items:center;gap:8px}.site-dot{width:8px;height:8px;border-radius:50%;background:#aab4c2}.site-btn.active .site-dot{background:var(--orange)}.count{font-size:11px;color:var(--muted)}.divider{border:0;border-top:1px solid var(--line);margin:16px 0}.note{font-size:12px;line-height:1.75;color:var(--muted)}.main{min-width:0}.toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:12px}.month-title{font-size:20px;font-weight:800}.month-sub{font-size:12px;color:var(--muted);margin-top:4px}.nav{display:flex;gap:7px}.calendar{overflow:hidden}.week{display:grid;grid-template-columns:repeat(7,1fr);background:#fbfcfe;border-bottom:1px solid var(--line)}.week div{padding:10px 12px;font-size:12px;font-weight:750;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.day{height:118px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}.day:nth-child(7n){border-right:0}.day.muted{background:#fbfcfe}.day.today{background:#fffaf7}.day-num{font-size:12px;font-weight:750;color:var(--muted);margin-bottom:7px}.day.today .day-num{color:var(--orange)}.day.today .day-num b{display:inline-grid;place-items:center;width:22px;height:22px;background:var(--orange);color:#fff;border-radius:50%}.calendar-mark{display:block;width:100%;border:1px solid #cfe0ff;border-left:3px solid var(--blue);background:var(--blue-weak);border-radius:7px;padding:6px 7px;text-align:left;cursor:pointer;overflow:hidden}.calendar-mark:hover{border-color:var(--blue)}.calendar-mark.done{border-color:#c7eadf;border-left-color:var(--green);background:var(--green-weak)}.calendar-mark-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:750}.calendar-mark-meta{display:block;color:var(--muted);font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{font-size:10px;color:var(--muted);margin-top:4px}.agenda{margin-top:16px;padding:17px}.agenda-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.agenda-title{font-size:14px;font-weight:800}.agenda-note{font-size:11px;color:var(--muted)}.agenda-list{display:grid;gap:8px}.agenda-row{display:grid;grid-template-columns:92px 72px minmax(160px,1fr) minmax(180px,1.4fr) 112px 84px;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}.agenda-row:hover{border-color:#cbd7e8;box-shadow:0 3px 10px rgba(25,42,70,.06)}.agenda-row.done{background:#fbfefc}.date{font-size:12px;font-weight:800;color:var(--blue)}.badge{display:inline-block;width:max-content;max-width:100%;border-radius:999px;background:#eef3ff;color:#4d69ae;padding:3px 7px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agenda-name{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agenda-period{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.deadline{font-size:11px;color:var(--red);white-space:nowrap}.status{font-size:11px;color:var(--muted);white-space:nowrap}.status.done{color:var(--green);font-weight:750}.unplanned{margin-top:16px;padding:17px}.unplanned-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.unplanned-row{border:1px solid #e3dafb;border-left:3px solid var(--purple);background:var(--purple-weak);border-radius:8px;padding:10px;cursor:pointer}.unplanned-row strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unplanned-row small{display:block;color:var(--muted);margin-top:4px}.detail{display:none;margin-top:16px;padding:18px}.detail.show{display:block}.detail-top{display:flex;justify-content:space-between;gap:12px}.detail-title{font-weight:800;font-size:19px;margin-bottom:5px}.detail-meta{font-size:12px;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.detail-item{border:1px solid var(--line);background:#fcfdff;border-radius:9px;padding:12px}.label{font-size:11px;color:var(--muted);margin-bottom:5px}.value{line-height:1.65;word-break:break-word}.value.deadline{font-weight:750;color:var(--red)}.links a{display:block;color:var(--blue);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 0}.empty{padding:42px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.side{position:static}.site-list{grid-template-columns:repeat(3,1fr)}.agenda-row{grid-template-columns:84px 68px minmax(140px,1fr) minmax(160px,1.3fr) 100px 76px}}
@media(max-width:680px){.app{padding:18px}.topbar{flex-direction:column}.toolbar{align-items:flex-start;flex-direction:column}.site-list{grid-template-columns:repeat(2,1fr)}.calendar{overflow-x:auto}.week,.grid{min-width:730px}.agenda-row{grid-template-columns:1fr;gap:5px}.detail-grid,.unplanned-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div><div class="eyebrow">SHOPEE OPERATIONS</div><h1>多站点活动日历</h1><div class="sub">日历只显示活动实际生效/执行时间；提报截止时间仅作为提醒，不会被误当作活动日期。</div></div><div class="actions"><button class="btn" onclick="goToday()">回到今天</button><button class="btn" onclick="reloadData()">刷新数据</button><button class="btn primary" onclick="openExtractor()">打开提取工具</button></div></header>
<div class="layout"><aside class="panel side"><div class="section-title">站点筛选</div><div class="site-list" id="site-list"></div><hr class="divider"><div class="section-title">识别口径</div><div class="note">站点优先读取活动标题中的明确国家标识；单独写 MY/马来但未注明店铺的活动归入“马来未分店”，不会自动归入马来1店。日历日期只读取活动排期。</div></aside>
<main class="main"><div class="toolbar"><div><div class="month-title" id="month-title"></div><div class="month-sub">月历仅标记活动开始日；下方清单展示完整活动周期，避免同一活动重复铺满日期格。</div></div><div class="nav"><button class="btn" onclick="moveMonth(-1)">上月</button><button class="btn" onclick="moveMonth(1)">下月</button></div></div><section class="card calendar"><div class="week"><div>周一</div><div>周二</div><div>周三</div><div>周四</div><div>周五</div><div>周六</div><div>周日</div></div><div class="grid" id="calendar-grid"></div></section><section class="card agenda" id="agenda"></section><section class="card unplanned" id="unplanned"></section><section class="card detail" id="detail"></section></main></div>
</div>
<script>
const STORAGE_KEY='shopee_activity_todo_v1';
const SITE_OPTIONS=[['ALL','全部站点'],['MY1','马来1店'],['MY2','马来2店'],['MYU','马来未分店'],['TH','泰国'],['VN','越南'],['PH','菲律宾'],['OTHER','其他/待确认']];
let todos=[],selectedSite='ALL',viewDate=new Date();
function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function explicitSite(text){const s=String(text||'').toUpperCase();if(/马来\s*1|马来一|MY\s*1/.test(s))return'MY1';if(/马来\s*2|马来二|MY\s*2/.test(s))return'MY2';if(/泰国|\bTH(?:AILAND)?\b/.test(s))return'TH';if(/越南|\bVN(?:IETNAM)?\b/.test(s))return'VN';if(/菲律宾|\bPH(?:ILIPPINES)?\b/.test(s))return'PH';if(/新加坡|\bSG\b|阿根廷|\bAR\b|巴西|\bBR\b|墨西哥|\bMX\b|印尼|\bID\b|台湾|\bTW\b/.test(s))return'OTHER';return null}
function normalizeSite(value,item){const title=String(item?.title||'');const link=String(item?.link||'');const strong=explicitSite(title);if(strong)return strong;const fromLink=explicitSite(link);if(fromLink)return fromLink;const s=String(value||'');const explicit=explicitSite(s);if(explicit)return explicit;if(/^MY$/i.test(s)||/马来/.test(s))return'MYU';if(/^TH$/i.test(s)||/泰国/.test(s))return'TH';if(/^VN$/i.test(s)||/越南/.test(s))return'VN';if(/^PH$/i.test(s)||/菲律宾/.test(s))return'PH';return'OTHER'}
function label(key){return SITE_OPTIONS.find(x=>x[0]===key)?.[1]||'其他/待确认'}
function load(){try{const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');todos=Array.isArray(raw)?raw:[]}catch(e){todos=[]}todos=todos.map(x=>({...x,_site:normalizeSite(x.site,x)}));renderAll()}
function reloadData(){load()}
function openExtractor(){location.href='file:///D:/Accio/Shopee活动公告智能提取工具.html'}
function list(){return todos.filter(x=>selectedSite==='ALL'||x._site===selectedSite)}
function date(y,m,d,h=0,min=0){const x=new Date(+y,+m-1,+d,h,min);return isNaN(x.getTime())?null:x}
function tokens(text){const s=String(text||'').replace(/至|到/g,'-'),out=[];let m;const full=/(20\d{2})\s*[年./-]\s*(\d{1,2})\s*[月./-]\s*(\d{1,2})\s*日?/g;while(m=full.exec(s))out.push({i:m.index,e:full.lastIndex,y:+m[1],m:+m[2],d:+m[3]});const short=/(?<!\d)(\d{1,2})\s*[./-]\s*(\d{1,2})(?!\d)/g;while(m=short.exec(s)){if(!out.some(x=>m.index>=x.i&&m.index<x.e))out.push({i:m.index,e:short.lastIndex,m:+m[1],d:+m[2]})}const cn=/(?<!\d)(\d{1,2})\s*月\s*(\d{1,2})\s*日?/g;while(m=cn.exec(s)){if(!out.some(x=>m.index>=x.i&&m.index<x.e))out.push({i:m.index,e:cn.lastIndex,m:+m[1],d:+m[2]})}return out.sort((a,b)=>a.i-b.i)}
function yearFor(text,t){return t.y||Number((String(text).match(/(20\d{2})\s*年/)||[])[1]||viewDate.getFullYear())}
function activitySegments(item){const raw=String(item.schedule||'').trim();if(!raw||raw==='-'||/未提供|详见通知|无明确|原公告/.test(raw))return[];const text=raw.replace(/至|到/g,'-');const ym=text.match(/(?:(20\d{2})\s*年\s*)?(\d{1,2})\s*月\s*(全月|整月|全程)/);if(ym){const y=+(ym[1]||viewDate.getFullYear()),m=+ym[2];return[{start:new Date(y,m-1,1),end:new Date(y,m+1,0,23,59),range:`${y}.${String(m).padStart(2,'0')}.01 - ${y}.${String(m).padStart(2,'0')}.${new Date(y,m+1,0).getDate()}`}]}const ts=tokens(text);if(!ts.length)return[];const seg=[];for(let i=0;i<ts.length;i++){const a=ts[i],between=text.slice(a.e,(ts[i+1]||{}).i||text.length);if(/截止|DDL|结果确认|申诉|改价|报名|提报|检查|反馈/.test(text.slice(Math.max(0,a.i-10),a.i)))continue;const start=date(yearFor(text,a),a.m,a.d);if(!start)continue;const n=ts[i+1];if(n&&/[-~—]/.test(between)){const end=date(yearFor(text,n),n.m,n.d,23,59);if(end&&end>=start){seg.push({start,end,range:formatDate(start)+' - '+formatDate(end)});i++;continue}}if(/活动|生效|周期|排期|上线|执行/.test(text)||ts.length===2)seg.push({start,end:date(start.getFullYear(),start.getMonth()+1,start.getDate(),23,59),range:formatDate(start)});}return seg}
function formatDate(d){return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')}
function onDay(item,d){return activitySegments(item).some(seg=>seg.start.getFullYear()===d.getFullYear()&&seg.start.getMonth()===d.getMonth()&&seg.start.getDate()===d.getDate())}
function deadline(v){const s=String(v||'');let m=s.match(/(20\d{2})[-/.年](\d{1,2})[-/.月](\d{1,2})(?:日)?(?:\s+|T)?(\d{1,2})?(?::(\d{1,2}))?/);if(m)return date(m[1],m[2],m[3],m[4]||23,m[5]||59);m=s.match(/(\d{1,2})[-/.月](\d{1,2})(?:日)?(?:\s+|T)?(\d{1,2})?(?::(\d{1,2}))?/);return m?date(viewDate.getFullYear(),m[1],m[2],m[3]||23,m[4]||59):null}
function overdue(x){const d=deadline(x.deadline);return !x.completed&&d&&d<new Date()}
function renderAll(){renderSites();renderCalendar();renderAgenda();renderUnplanned()}
function renderSites(){document.getElementById('site-list').innerHTML=SITE_OPTIONS.map(([k,n])=>{const c=k==='ALL'?todos.length:todos.filter(x=>x._site===k).length;return`<button class="site-btn ${k===selectedSite?'active':''}" onclick="selectSite('${k}')"><span class="site-left"><i class="site-dot"></i>${n}</span><span class="count">${c}</span></button>`}).join('')}
function selectSite(k){selectedSite=k;renderAll()}
function calendarItems(){return list().filter(x=>activitySegments(x).some(seg=>seg.start.getFullYear()===viewDate.getFullYear()&&seg.start.getMonth()===viewDate.getMonth()))}
function renderCalendar(){const y=viewDate.getFullYear(),m=viewDate.getMonth();document.getElementById('month-title').textContent=`${y} 年 ${m+1} 月`;const first=new Date(y,m,1),off=(first.getDay()+6)%7,cells=[];for(let i=0;i<42;i++){const d=new Date(y,m,i-off+1),items=list().filter(x=>onDay(x,d));cells.push(`<div class="day ${d.getMonth()===m?'':'muted'} ${d.toDateString()===new Date().toDateString()?'today':''}"><div class="day-num">${d.toDateString()===new Date().toDateString()?'<b>今</b>':d.getDate()}</div>${items.slice(0,1).map(x=>{const seg=activitySegments(x)[0];return`<button class="calendar-mark ${x.completed?'done':''}" title="${esc(x.title)}" onclick="showDetail(${JSON.stringify(x.key)})"><span class="calendar-mark-title">${esc(x.title||'未命名活动')}</span><span class="calendar-mark-meta">${esc(label(x._site))} · ${esc(seg.range)}</span></button>`}).join('')}${items.length>1?`<div class="more">+${items.length-1} 个活动</div>`:''}</div>`)}document.getElementById('calendar-grid').innerHTML=cells}
function renderAgenda(){const data=calendarItems().sort((a,b)=>activitySegments(a)[0].start-activitySegments(b)[0].start),el=document.getElementById('agenda');el.innerHTML=`<div class="agenda-head"><div class="agenda-title">${viewDate.getFullYear()} 年 ${viewDate.getMonth()+1} 月活动清单</div><div class="agenda-note">共 ${data.length} 项，按活动开始日排序</div></div>${data.length?`<div class="agenda-list">${data.map(x=>{const seg=activitySegments(x)[0];return`<button class="agenda-row ${x.completed?'done':''}" onclick="showDetail(${JSON.stringify(x.key)})"><span class="date">${formatDate(seg.start)}</span><span class="badge">${esc(label(x._site))}</span><span class="agenda-name" title="${esc(x.title)}">${esc(x.title||'未命名活动')}</span><span class="agenda-period" title="${esc(x.schedule)}">${esc(seg.range)}</span><span class="deadline">DDL ${esc(x.deadline||'未提供')}</span><span class="status ${x.completed?'done':''}">${x.completed?'已完成':overdue(x)?'提报逾期':'待提报'}</span></button>`}).join('')}</div>`:'<div class="empty"><strong>本月没有识别到活动排期</strong>请切换月份或检查提取工具中的活动排期字段。</div>'}`}
function renderUnplanned(){const data=list().filter(x=>!activitySegments(x).length),el=document.getElementById('unplanned');if(!data.length){el.innerHTML='';return}el.innerHTML=`<div class="section-title">待补充活动时间 <span style="font-weight:400;color:var(--muted)">（不会按报名截止时间放入日历）</span></div><div class="unplanned-list">${data.map(x=>`<button class="unplanned-row" onclick="showDetail(${JSON.stringify(x.key)})"><strong>${esc(x.title||'未命名活动')}</strong><small>${esc(label(x._site))} · 排期：${esc(x.schedule||'未提供')}</small></button>`).join('')}</div>`}
function showDetail(key){const x=todos.find(v=>v.key===key);if(!x)return;const links=String(x.link||'').split(/\\n|\n/).map(v=>v.trim()).filter(v=>/^https?:\/\//.test(v)),d=document.getElementById('detail');d.classList.add('show');d.innerHTML=`<div class="detail-top"><div><div class="detail-title">${esc(x.title||'未命名活动')}</div><div class="detail-meta">${esc(label(x._site))} · ${esc(x.type||'常规活动')} · ${x.completed?'已完成':overdue(x)?'提报逾期':'待提报'}</div></div><button class="btn" onclick="document.getElementById('detail').classList.remove('show')">关闭</button></div><div class="detail-grid"><div class="detail-item"><div class="label">活动时间（用于日历）</div><div class="value">${esc(x.schedule||'未识别')}</div></div><div class="detail-item"><div class="label">报名截止时间（仅提醒）</div><div class="value deadline">${esc(x.deadline||'未提供')}</div></div><div class="detail-item"><div class="label">活动要求</div><div class="value">${esc(x.req||'未提供')}</div></div><div class="detail-item"><div class="label">操作路径 / 对接人</div><div class="value">${esc(x.path||'-')} / ${esc(x.manager||'-')}</div></div><div class="detail-item links"><div class="label">提报链接</div>${links.length?links.map(v=>`<a href="${esc(v)}" target="_blank" rel="noopener" title="${esc(v)}">🔗 点击查看</a>`).join(''):'<div class="value">原公告没有提供有效链接</div>'}</div></div>`;d.scrollIntoView({behavior:'smooth',block:'nearest'})}
function moveMonth(n){viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+n,1);renderAll()}function goToday(){viewDate=new Date();renderAll()}load();
</script>
</body>
</html>
